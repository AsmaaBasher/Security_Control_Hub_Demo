<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Control Hub — Demo</title>
<style>
:root{
  --navy:#0b1f3a; --navy2:#122b4d; --blue:#1d5fbf; --blue2:#2f7de1; --cyan:#17b6c9;
  --bg:#f3f5f9; --card:#ffffff; --line:#e1e6ef; --text:#1b2433; --muted:#667388;
  --green:#1f9d55; --green-bg:#e6f6ec; --yellow:#c98a06; --yellow-bg:#fff5db; --red:#d23c3c; --red-bg:#fde9e9;
  --purple:#6b4fd8; --radius:10px; --shadow:0 1px 3px rgba(16,30,60,.08),0 1px 2px rgba(16,30,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,"Arial",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
a{color:var(--blue);text-decoration:none;cursor:pointer}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 14px;transition:.15s}
button:hover:not(:disabled){border-color:var(--blue2);color:var(--blue)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover:not(:disabled){background:var(--blue2);color:#fff}
button.danger{background:var(--red);border-color:var(--red);color:#fff}
button.danger:hover:not(:disabled){color:#fff;opacity:.9}
button.ghost{background:transparent;border-color:transparent}
button.sm{padding:4px 10px;font-size:12px}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--text);width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(47,125,225,.25);border-color:var(--blue2)}
label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
.field{margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}

/* demo banner */
#demoBanner{background:repeating-linear-gradient(-45deg,#0b1f3a,#0b1f3a 12px,#10284a 12px,#10284a 24px);color:#cfe9f2;font-size:12px;text-align:center;padding:4px 8px;letter-spacing:.2px}
#demoBanner b{color:#7fe3ef}

/* layout */
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 26px)}
.sidebar{background:var(--navy);color:#c8d3e6;padding:16px 10px;position:sticky;top:0;height:calc(100vh - 26px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue2),var(--cyan));display:grid;place-items:center;color:#fff;font-weight:700}
.brand .name{font-weight:700;color:#fff;font-size:14px;line-height:1.2}
.brand .name small{display:block;color:#7fa0c8;font-weight:400;font-size:11px}
.nav a{display:flex;align-items:center;gap:10px;color:#c8d3e6;padding:8px 10px;border-radius:8px;margin-bottom:2px;font-size:13px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:var(--blue);color:#fff}
.nav .sec{font-size:11px;color:#6f8bb3;margin:14px 10px 6px;font-weight:600}
.nav .cnt{margin-inline-start:auto;background:var(--cyan);color:var(--navy);border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
.main{min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 22px;position:sticky;top:0;z-index:20}
.topbar .crumbs{font-weight:600;color:var(--navy)}
.userchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:30px;padding:3px 12px 3px 4px;cursor:pointer;background:#fff}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--navy2);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.userchip .r{font-size:11px;color:var(--muted);line-height:1.1}
.bell{position:relative;border:none;background:none;font-size:18px;padding:4px 8px}
.bell .dot{position:absolute;top:0;left:2px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;font-weight:700}
.content{padding:22px;max-width:1400px}
h1{font-size:20px;margin:0 0 4px;color:var(--navy)}
h2{font-size:16px;margin:0 0 12px;color:var(--navy)}
h3{font-size:14px;margin:0 0 10px;color:var(--navy)}
.sub{color:var(--muted);margin-bottom:18px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card.tight{padding:0;overflow:hidden}
.pagehead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pagehead .t{flex:1;min-width:240px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:9px 14px;color:var(--muted);border-bottom:2px solid transparent;font-weight:600;font-size:13px}
.tabs a.active{color:var(--blue);border-color:var(--blue)}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#f6f8fb;color:var(--muted);font-weight:600;text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#f8fbff}
.tablewrap{overflow:auto}

/* badges */
.b{display:inline-block;padding:1px 9px;border-radius:12px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.b.g{background:var(--green-bg);color:var(--green)}
.b.y{background:var(--yellow-bg);color:var(--yellow)}
.b.r{background:var(--red-bg);color:var(--red)}
.b.bl{background:#e7f0fc;color:var(--blue)}
.b.gr{background:#eef1f5;color:#56637a}
.b.p{background:#efebff;color:var(--purple)}
.code{font-family:Consolas,"Courier New",monospace;direction:ltr;unicode-bidi:embed;font-size:12px;color:#334}

/* KPI */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:24px;font-weight:700;color:var(--navy);line-height:1.2}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:var(--blue2)}

/* system cards */
.syscards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.syscard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);border-top:4px solid var(--line);display:flex;flex-direction:column;gap:10px}
.syscard.g{border-top-color:var(--green)}.syscard.y{border-top-color:var(--yellow)}.syscard.r{border-top-color:var(--red)}.syscard.n{border-top-color:#9aa6b8}
.syscard .ic{font-size:26px}
.syscard .nm{font-weight:700;font-size:15px;color:var(--navy)}
.syscard .stats{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.syscard .big{font-size:22px;font-weight:700}
.syscard.add{border:2px dashed #b8c4d8;border-top:2px dashed #b8c4d8;align-items:center;justify-content:center;color:var(--blue);cursor:pointer;min-height:200px;background:#fafcff}
.syscard.add:hover{border-color:var(--blue2)}
.bar{height:7px;background:#edf0f5;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px}

/* tasks strip */
.tasks{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.task{background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--blue);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
.task:hover{border-color:var(--blue2)}
.task.warn{border-inline-start-color:var(--red)}

/* modal */
.modalbg{position:fixed;inset:0;background:rgba(11,31,58,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:50px 16px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:640px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:920px}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;flex:1}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;flex-direction:row-reverse}

/* toast */
#toasts{position:fixed;bottom:18px;left:18px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px;max-width:380px;animation:tin .2s}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

/* dropdown */
.dropdown{position:absolute;top:52px;left:20px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);width:360px;z-index:50;max-height:420px;overflow:auto}
.dropdown .it{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.dropdown .it.unread{background:#f3f8ff}
.dropdown .it small{color:var(--muted);display:block}

/* login */
.login{min-height:calc(100vh - 26px);display:grid;grid-template-columns:1.1fr 1fr}
.login .hero{background:linear-gradient(160deg,var(--navy),#163a6b 60%,#0f5a78);color:#fff;padding:60px 56px;display:flex;flex-direction:column;justify-content:center}
.login .hero h1{color:#fff;font-size:32px;margin-bottom:8px}
.login .hero p{color:#bcd0ea;font-size:15px;max-width:460px}
.login .hero ul{color:#d8e6f7;padding-inline-start:18px;line-height:2}
.login .form{padding:50px 48px;display:flex;flex-direction:column;justify-content:center;max-width:560px}
.persona{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.persona button{text-align:start;padding:8px 10px;display:flex;gap:8px;align-items:center}
.persona button.sel{border-color:var(--blue);background:#eef5ff}
.persona .r{font-size:11px;color:var(--muted);display:block;line-height:1.2}

/* wizard */
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps .s{flex:1;min-width:110px;padding:8px 10px;border-radius:8px;background:#eef1f5;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.steps .s.on{background:var(--blue);color:#fff}
.steps .s.done{background:#dfeefe;color:var(--blue)}
.chk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff}
.chk input{width:auto}
.chk.on{border-color:var(--blue2);background:#f3f8ff}

.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;border:1px solid}
.alert.w{background:var(--yellow-bg);border-color:#f2d48a;color:#7a5300}
.alert.e{background:var(--red-bg);border-color:#f3b4b4;color:#8a1f1f}
.alert.i{background:#eaf3ff;border-color:#bcd6fa;color:#1b4a8a}
.alert.s{background:var(--green-bg);border-color:#a8dcbb;color:#14653a}

.split{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.timeline{border-inline-start:2px solid var(--line);padding-inline-start:14px;margin-inline-start:6px}
.timeline .e{position:relative;margin-bottom:10px;font-size:12.5px}
.timeline .e:before{content:"";position:absolute;right:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue2)}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kcol{background:#eef1f6;border-radius:10px;padding:8px;min-height:120px}
.kcol h4{margin:4px 6px 8px;font-size:12px;color:var(--muted)}
.kitem{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;font-size:12px;cursor:pointer}
.heat td{width:56px;height:44px;text-align:center;font-weight:700;border:2px solid #fff;border-radius:6px;cursor:pointer;color:#fff}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
.raci-sel{width:58px;padding:4px;text-align:center;font-weight:700}
.raci-R{background:#e7f0fc;color:var(--blue)}.raci-A{background:#efebff;color:var(--purple)}.raci-C{background:var(--yellow-bg);color:var(--yellow)}.raci-I{background:#eef1f5;color:#56637a}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* tour */
#tourMask{position:fixed;inset:0;z-index:400;pointer-events:none}
#tourHole{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(8,20,40,.55);transition:all .25s;pointer-events:none;z-index:401;border:2px solid var(--cyan)}
#tourPop{position:fixed;z-index:402;background:#fff;border-radius:12px;width:360px;max-width:calc(100vw - 30px);box-shadow:0 18px 50px rgba(0,0,0,.35);padding:16px 18px;pointer-events:auto}
#tourPop h4{margin:0 0 6px;color:var(--navy);font-size:15px}
#tourPop p{margin:0 0 12px;font-size:13px;color:#33415a}
#tourPop .pg{font-size:11px;color:var(--muted)}
#tourPop .as{background:#eef7f9;color:#0f6b77;font-size:12px;border-radius:6px;padding:4px 8px;margin-bottom:10px}

/* print / report */
#reportView{position:fixed;inset:0;background:#e9edf3;z-index:200;overflow:auto;padding:24px}
#reportView .paper{background:#fff;max-width:900px;margin:0 auto;padding:40px 46px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
#reportView .rtools{max-width:900px;margin:0 auto 12px;display:flex;gap:8px}
.rhead{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:18px}
.rhead .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--blue2),var(--cyan));color:#fff;display:grid;place-items:center;font-weight:700}
.conf{color:var(--red);font-weight:700;font-size:12px;border:1px solid var(--red);padding:2px 8px;border-radius:6px}
@media print{
  body *{visibility:hidden}
  #reportView,#reportView *{visibility:visible}
  #reportView{position:absolute;inset:0;padding:0;background:#fff}
  #reportView .rtools{display:none}
  #reportView .paper{box-shadow:none;max-width:none;padding:10mm}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}
  .grid4,.grid3{grid-template-columns:1fr 1fr}.split,.grid2,.login{grid-template-columns:1fr}
  .kanban{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .sidebar{padding:8px}
  .brand{padding:2px 4px 8px;margin-bottom:6px}
  .nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav a{white-space:nowrap;margin:0;flex:none}
  .nav .sec{display:none}
  .topbar{flex-wrap:wrap;padding:8px 12px}
  .content{padding:14px}
  .grid4[style]{grid-template-columns:1fr 1fr!important}
  .login .hero{padding:30px 24px}.login .form{padding:30px 20px}
}

</style>
</head>
<body>
<div id="demoBanner"><b>DEMO VERSION</b> — نسخة عرض ببيانات افتراضية، والحماية فيها محاكاة. المنتج الفعلي بيتشغل على Server داخلي. &nbsp; <a id="aboutBtn" style="color:#7fe3ef">عن الـ Demo</a> &nbsp;|&nbsp; <a id="resetBtn" style="color:#7fe3ef">↺ Reset Demo</a></div>
<div id="app"></div>
<div id="toasts"></div>
<script>
/* ===== Seed data: fictional organization for demo only ===== */
const DAY = 864e5;
function dISO(offset){ const d = new Date(Date.now() + offset*DAY); return d.toISOString().slice(0,10); }
function tISO(offsetDays, hour){ const d = new Date(Date.now() + offsetDays*DAY); if(hour!=null){d.setHours(hour, (offsetDays*7)%60|0, 0, 0);} return d.toISOString(); }

const GENERIC_LEVELS = [
  'غير موجود: الـ Control مش مطبق خالص',
  'مبدئي (Initial): بيتعمل أحيانًا وبشكل يدوي ومن غير ترتيب',
  'متكرر (Repeatable): بيتعمل بانتظام بس من غير إجراء مكتوب',
  'معرّف (Defined): فيه إجراء مكتوب ومعتمد وبيتطبق',
  'مُدار (Managed): بيتقاس وبيتراجع بشكل دوري وفيه أدلة موثقة',
  'محسّن (Optimized): مراقبة تلقائية وتحسين مستمر'
];

const RISK_LIBRARY = {
  app: [
    {k:'mod', t:'Unauthorized modification of data', ar:'تعديل البيانات من غير صلاحية'},
    {k:'acc', t:'Unauthorized access', ar:'دخول غير مصرح بيه'},
    {k:'loss', t:'Data loss', ar:'ضياع البيانات'},
    {k:'leak', t:'Data leakage', ar:'تسريب البيانات'},
    {k:'orph', t:'Orphan accounts', ar:'حسابات موظفين مشيوا لسه شغالة'},
    {k:'inp', t:'Input errors', ar:'أخطاء في الإدخال'},
    {k:'unav', t:'Service unavailability', ar:'توقف الخدمة'}
  ],
  net: [
    {k:'def', t:'Default credentials abuse', ar:'استغلال كلمات السر الافتراضية'},
    {k:'vuln', t:'Unpatched firmware vulnerabilities', ar:'ثغرات في Firmware مش متحدث'},
    {k:'cfg', t:'Configuration loss or tampering', ar:'ضياع الإعدادات أو التلاعب بيها'},
    {k:'lat', t:'Lateral movement inside network', ar:'تنقل المهاجم جوه الشبكة'},
    {k:'blind', t:'No visibility on network events', ar:'غياب الرؤية على أحداث الشبكة'},
    {k:'phys', t:'Physical tampering', ar:'العبث الفعلي بالأجهزة'}
  ],
  iot: [
    {k:'def', t:'Default credentials abuse', ar:'استغلال كلمات السر الافتراضية'},
    {k:'exp', t:'Device exposed to network attacks', ar:'الأجهزة مكشوفة لهجمات الشبكة'},
    {k:'priv', t:'Privacy violation of recordings', ar:'انتهاك خصوصية التسجيلات'},
    {k:'loss', t:'Loss of recordings', ar:'ضياع التسجيلات'},
    {k:'phys', t:'Physical tampering', ar:'العبث الفعلي بالأجهزة'}
  ],
  cloud: [
    {k:'mis', t:'Cloud misconfiguration', ar:'إعدادات Cloud غلط'},
    {k:'acc', t:'Account takeover', ar:'الاستيلاء على حساب'},
    {k:'leak', t:'Data leakage', ar:'تسريب البيانات'},
    {k:'vend', t:'Vendor dependency', ar:'الاعتماد على مزود الخدمة'}
  ]
};

/* Control templates suggested by the wizard per risk key (system type: app) */
const CONTROL_TEMPLATES = {
  app: [
    {risk:'mod', title:'Role-based Access: صلاحية التعديل للمسؤولين بس', type:'Preventive', w:3, map:{iso:'A.5.15',nist:'PR.AA',cis:'CIS 6'}},
    {risk:'mod', title:'Audit Log لكل تعديل في البيانات', type:'Detective', w:3, map:{iso:'A.8.15',nist:'DE.CM',cis:'CIS 8'}},
    {risk:'inp', title:'Maker-Checker: اللي بيدخل غير اللي بيعتمد', type:'Preventive', w:3, map:{iso:'A.5.3',nist:'PR.AA',cis:'—'}},
    {risk:'loss', title:'Backup يومي واختبار Restore شهري', type:'Corrective', w:3, map:{iso:'A.8.13',nist:'PR.DS',cis:'CIS 11'}},
    {risk:'orph', title:'Access Review دوري للصلاحيات', type:'Detective', w:2, map:{iso:'A.5.18',nist:'PR.AA',cis:'CIS 6'}},

/* --- SHA-256 (sync, small) --- */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  const mp=Math.pow, maxWord=mp(2,32); let result='', words=[];
  const bytes = unescape(encodeURIComponent(ascii)); const blen = bytes.length*8;
  let hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], pl=k.length;
  const isC={};
  for(let c=2; pl<64; c++){ if(!isC[c]){ for(let i=0;i<313;i+=c) isC[i]=c; hash[pl]=(mp(c,.5)*maxWord)|0; k[pl++]=(mp(c,1/3)*maxWord)|0; } }
  hash = hash.slice(0,8);
  let s = bytes + '\x80'; while(s.length%64-56) s+='\x00';
  for(let i=0;i<s.length;i++){ const j=s.charCodeAt(i); words[i>>2] |= j << ((3-i)%4)*8; }
  words[words.length]=((blen/maxWord)|0); words[words.length]=(blen);
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16), oh=hash; hash=hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      const t1 = hash[7] + (rr(e,6)^rr(e,11)^rr(e,25)) + ((e&hash[5])^((~e)&hash[6])) + k[i]
        + (w[i] = (i<16)? w[i] : (w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(let i=0;i<8;i++) hash[i]=(hash[i]+oh[i])|0;
  }
  for(let i=0;i<8;i++) for(let j=3;j+1;j--){ const b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); }
  return result;
}

/* --- Audit log with hash chain --- */
function auditPayload(e){ return [e.seq,e.at,e.user,e.action,e.obj,e.old,e.nw,e.ip,e.prev].join('|'); }
function audit(action, obj, oldV, newV, userId, at){
  const prev = S.audit.length ? S.audit[S.audit.length-1].hash : '0'.repeat(64);
  const e = {seq:S.audit.length+1, at: at || new Date().toISOString(), user: userId || (S.me||'system'), action, obj: obj||'', old: oldV==null?'':String(oldV), nw: newV==null?'':String(newV), ip: userIp(userId || S.me), prev};
  e.hash = sha256(auditPayload(e));
  S.audit.push(e);
}
function userIp(uid){ const n = {u1:11,u2:12,u3:13,u4:14,u5:15,u6:16,u7:17,u8:18,u9:19}[uid]||10; return '10.0.5.'+n; }
function verifyChain(){
  let prev='0'.repeat(64);
  for(const e of S.audit){ if(e.prev!==prev || sha256(auditPayload(e))!==e.hash) return {ok:false, at:e.seq}; prev=e.hash; }
  return {ok:true, n:S.audit.length};
}

  if(!u) return ''; if(u.global) return ROLE_AR[u.global];
  const r = Object.entries(u.mods||{}).map(([m,r])=>ROLE_AR[r]+' – '+(M(m)?M(m).nameAr:m)); return r.join('، ')||'بدون دور';
}
function initials(n){ return (n||'?').replace(/^(م\.|د\.|أ\.)\s*/,'').slice(0,1); }

/* --- permissions (in the real product these are enforced server-side) --- */
function can(action, ctx){
  const u = me(); if(!u) return false; const g = u.global; ctx = ctx||{};
  const mr = ctx.mod ? roleIn(u, ctx.mod) : null;
  switch(action){
    case 'viewModule': return g==='ciso'||g==='auditor'||!!mr;
    case 'manageAssets': return g==='ciso'||mr==='owner';
    case 'editControl': return g==='ciso';
    case 'editRaci': return g==='ciso'||mr==='owner';
    case 'newCycle': return g==='ciso'||mr==='owner';
    case 'assess': { const a=ctx.a; return !!a && CT(a.control).raci.R===u.id && ['Not Started','Draft','Returned'].includes(a.status) && cycleOpen(a.cycle); }
    case 'review': { const a=ctx.a; return !!a && roleIn(u,a.mod)==='owner' && a.status==='Submitted' && a.assessor!==u.id; }
    case 'approve': { const a=ctx.a; return !!a && g==='ciso' && a.status==='Under Review' && a.assessor!==u.id; }
    case 'updateAction': { const x=ctx.x; return !!x && x.owner===u.id && ['Open','In Progress'].includes(x.status); }
    case 'approveExt': { const x=ctx.x; return !!x && x.acc===u.id; }
    case 'verify': return g==='auditor';
    case 'createFinding': return g==='auditor';
    case 'respondFinding': return mr==='owner';
    case 'requestAcceptance': return g==='ciso'||mr==='owner';
    case 'cisoOpinion': return g==='ciso';
    case 'execDecide': return g==='exec';
    case 'manageUsers': return g==='admin';
    case 'settings': return g==='admin'||g==='ciso';
    case 'backup': return g==='admin';
    case 'auditLog': return g==='admin'||g==='auditor';
    case 'moduleLib': return g==='admin'||g==='ciso';
    case 'builder': return g==='ciso';
    case 'reports': return g==='ciso'||g==='auditor'||g==='exec'||Object.keys(u.mods||{}).length>0;
    case 'execDash': return g==='exec'||g==='ciso';
    case 'raciGlobal': return g==='ciso'||g==='auditor'||Object.values(u.mods||{}).includes('owner');
  }
  return false;
}
function visibleModules(){ return S.modules.filter(m=>m.status==='Active' && can('viewModule',{mod:m.id})); }

/* --- metrics --- */
function cycleOpen(cid){ const c=S.cycles.find(x=>x.id===cid); return c && c.status==='In Progress'; }
function currentCycle(mod){ const cs=S.cycles.filter(c=>c.mod===mod); return cs[cs.length-1]; }
function controlsOf(mod){ return S.controls.filter(c=>c.mod===mod); }
function assessmentsOf(cycleId){ return S.assessments.filter(a=>a.cycle===cycleId); }
/* effective maturity = latest approved: current cycle if approved, else previous */
function effective(cid){
  const c = CT(cid); const cy = currentCycle(c.mod);
  const a = cy && S.assessments.find(x=>x.cycle===cy.id && x.control===cid);
  if(a && a.status==='Approved' && a.na) return {mat:null, impl:'N/A', na:true, src:'current'};
  if(a && a.status==='Approved') return {mat:a.mat, impl:a.impl, src:'current'};
  const p = S.prev[cid]; if(p==null) return {mat:null, impl:'', src:'none'};
  return {mat:p, impl: p>=3?'Implemented':(p===0?'Not Implemented':'Partial'), src:'prev'};
}
function implScore(impl){ return impl==='Implemented'?1:impl==='Partial'?0.5:0; }
function modMetrics(mod){
  const cs = controlsOf(mod); let applicable=0, comp=0, mats=[], tgt=[], gaps=[];
  cs.forEach(c=>{ const e=effective(c.id); if(e.na) return; if(e.mat==null) return; applicable++; comp+=implScore(e.impl); mats.push(e.mat); tgt.push(c.target);
    const gap=Math.max(0,c.target-e.mat); if(gap>0) gaps.push({c, gap, cur:e.mat, pr: priority(c, gap)}); });
  gaps.sort((a,b)=>b.pr-a.pr);
  const avg = mats.length? mats.reduce((a,b)=>a+b,0)/mats.length : 0;
  const tavg = tgt.length? tgt.reduce((a,b)=>a+b,0)/tgt.length : 0;
  return {comp: applicable? Math.round(comp/applicable*100) : 0, mat: Math.round(avg*10)/10, tgt: Math.round(tavg*10)/10, applicable, total:cs.length, gaps};
}
function critOfControl(c){ const as = S.assets.filter(a=>a.mod===c.mod && c.applies.includes(a.type)); return as.length? Math.max(...as.map(a=>a.crit)) : (M(c.mod)||{}).crit||2; }
function priority(c, gap){ return gap * c.w * critOfControl(c); }
function statusColor(p){ return p>=S.settings.green?'g':p>=S.settings.yellow?'y':'r'; }
function colorVar(cl){ return {g:'var(--green)',y:'var(--yellow)',r:'var(--red)'}[cl]||'#9aa6b8'; }
function trendOf(mod){
  const cs = S.cycles.filter(c=>c.mod===mod);
  return cs.map(c=>({name:c.name.split(' – ')[0], comp: c.summary? c.summary.comp : (c.status==='Closed'||c===currentCycle(mod)? modMetrics(mod).comp : null)}));
}
function riskResidual(r){
  const ms = r.controls.map(id=>effective(id).mat).filter(x=>x!=null); const avg = ms.length? ms.reduce((a,b)=>a+b,0)/ms.length : 0;
  const L = Math.max(1, Math.round(r.L * (1 - (avg/5)*0.6)));
  return {L, I:r.I, score:L*r.I, avg:Math.round(avg*10)/10};
}
function riskLevel(score){ return score>=20?{t:'Critical',c:'r'}:score>=12?{t:'High',c:'r'}:score>=6?{t:'Medium',c:'y'}:{t:'Low',c:'g'}; }
function daysBetween(a,b){ return Math.round((Date.parse(b)-Date.parse(a))/DAY); }
function overdueDays(x){ if(['Closed','Risk Accepted','Pending Verification'].includes(x.status)) return 0; const d = daysBetween(x.due, dISO(0)); return d>0?d:0; }

function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso.length<=10? iso+'T00:00:00' : iso); const m=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر']; return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear(); }

/* --- charts (pure SVG) --- */
function radarSVG(axes, cur, tgt, size){
  size=size||300; const cx=size/2, cy=size/2+6, R=size/2-56, n=axes.length;
  const pt=(i,v)=>{ const a=-Math.PI/2 + i*2*Math.PI/n; return [cx + Math.cos(a)*R*v/5, cy + Math.sin(a)*R*v/5]; };
  let g=''; for(let l=1;l<=5;l++){ g+=`<polygon points="${axes.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="#e3e8f0"/>`; }
  axes.forEach((a,i)=>{ const [x,y]=pt(i,5); const [lx,ly]=pt(i,6.1); g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e3e8f0"/><text x="${lx}" y="${ly+4}" font-size="11" text-anchor="middle" fill="#56637a">${esc(a)}</text>`; });
  const poly=(vals,col,op)=>`<polygon points="${vals.map((v,i)=>pt(i,v).join(',')).join(' ')}" fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${size} ${size+10}" width="100%" style="max-width:${size+40}px">${g}${poly(tgt,'#17b6c9',0.08)}${poly(cur,'#1d5fbf',0.25)}</svg>`;
}
function lineSVG(points, w, h){
  w=w||420; h=h||160; const pad=30, vals=points.map(p=>p.comp).filter(v=>v!=null); if(!vals.length) return '';
  const X=i=>pad+ i*(w-2*pad)/Math.max(1,points.length-1), Y=v=>h-pad - v/100*(h-2*pad);
  let g=''; [0,50,100].forEach(v=>{ g+=`<line x1="${pad}" x2="${w-pad}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef1f5"/>`; if(v===50) return; g+=`<text x="${pad-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#8a96a8">${v}%</text>`; });
  const ps = points.map((p,i)=>p.comp==null?null:[X(i),Y(p.comp)]).filter(Boolean);
  g+=`<polyline points="${ps.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#1d5fbf" stroke-width="2.5"/>`;
  points.forEach((p,i)=>{ if(p.comp==null) return; g+=`<circle cx="${X(i)}" cy="${Y(p.comp)}" r="4" fill="#1d5fbf"/><text x="${X(i)}" y="${Y(p.comp)-10}" font-size="11" text-anchor="middle" fill="#1b2433" font-weight="600">${p.comp}%</text><text x="${X(i)}" y="${h-8}" font-size="11" text-anchor="middle" fill="#56637a">${esc(p.name)}</text>`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${g}</svg>`;
}
function heatColor(score){ return score>=20?'#b42323':score>=12?'#e0573b':score>=6?'#e6a817':'#3aa26a'; }
function heatTable(list, mode, onclickFn){
  let h='<table class="heat" style="border-collapse:separate;direction:ltr"><tr><td style="background:none;color:#56637a;font-size:11px">L \\ I</td>'; for(let i=1;i<=5;i++) h+=`<td style="background:none;color:#56637a;font-size:11px;height:20px">${i}</td>`; h+='</tr>';
  for(let L=5;L>=1;L--){ h+=`<tr><td style="background:none;color:#56637a;font-size:11px">${L}</td>`; for(let I=1;I<=5;I++){ const inCell=list.filter(r=>{ const v=mode==='res'?riskResidual(r):{L:r.L,I:r.I}; return v.L===L&&v.I===I; }); h+=`<td style="background:${heatColor(L*I)};opacity:${inCell.length?1:.28}" data-heat="${L}-${I}" onclick="${onclickFn||''}('${L}-${I}','${mode}')" title="${inCell.map(r=>r.title).join(' | ')}">${inCell.length||''}</td>`; } h+='</tr>'; }
  return h+'</table>';
}

const ROUTES = [];
function route(pattern, fn){ ROUTES.push({re:new RegExp('^'+pattern.replace(/:(\w+)/g,'([^/]+)')+'$'), fn}); }
function go(hash){ if(location.hash===hash) render(); else location.hash=hash; }
window.addEventListener('hashchange', ()=>render());

function render(){
  const h = location.hash.replace(/^#/,'') || '/home';
  if(!S.me && h!=='/login'){ location.hash='#/login'; return; }
  closeModal();
  const ddn = $('#notifDrop'); if(ddn) ddn.remove();
  for(const r of ROUTES){ const m = h.match(r.re); if(m){ try{ r.fn(...m.slice(1).map(decodeURIComponent)); }catch(e){ console.error(e); shell('خطأ', `<div class="alert e">حصل خطأ في عرض الشاشة: ${esc(e.message)}</div>`); } window.scrollTo(0,0); return; } }
  go('#/home');
}

function tasksFor(uid){
  const u = U(uid); const t = []; if(!u) return t;
  S.assessments.forEach(a=>{ if(!cycleOpen(a.cycle)) return; const c=CT(a.control);
    if(c.raci.R===uid && ['Not Started','Draft','Returned'].includes(a.status)) t.push({k:'assess', a, txt:(a.status==='Returned'?'راجع للتعديل: ':'تقييم ')+a.control, link:'#/assess/'+a.id, warn:a.status==='Returned'});
    if(roleIn(u,a.mod)==='owner' && a.status==='Submitted' && a.assessor!==uid) t.push({k:'review', a, txt:'مراجعة '+a.control, link:'#/review'});
    if(u.global==='ciso' && a.status==='Under Review' && a.assessor!==uid) t.push({k:'approve', a, txt:'اعتماد '+a.control, link:'#/approve'});
  });
  S.actions.forEach(x=>{ if(x.owner===uid && ['Open','In Progress'].includes(x.status)) t.push({k:'action', x, txt:(overdueDays(x)?'متأخر: ':'إجراء ')+x.id, link:'#/sys/'+x.mod+'/remed', warn:overdueDays(x)>0});
    if(u.global==='auditor' && x.status==='Pending Verification') t.push({k:'verify', x, txt:'تحقق من '+x.id, link:'#/verify'});
    (x.ext||[]).forEach(e=>{ if(e.status==='Pending' && x.acc===uid) t.push({k:'ext', x, txt:'طلب تمديد '+x.id, link:'#/sys/'+x.mod+'/remed'}); }); });
  S.acceptances.forEach(r=>{ if(u.global==='ciso' && r.status==='Pending CISO') t.push({k:'acc', r, txt:'رأي فني في '+r.id, link:'#/accept'});
    if(u.global==='exec' && r.status==='Pending Exec') t.push({k:'acc', r, txt:'قرار في '+r.id, link:'#/accept'}); });
  S.findings.forEach(f=>{ if(roleIn(u,f.mod)==='owner' && f.status==='Open') t.push({k:'finding', f, txt:'الرد على '+f.id, link:'#/sys/'+f.mod+'/findings', warn:true}); });
  if(u.global==='ciso'){ S.pendingRoleChanges.filter(p=>p.status==='Pending' && p.target!==uid && p.by!==uid).forEach(p=>t.push({k:'role', txt:'موافقة على تغيير صلاحيات '+uname(p.target), link:'#/admin/users'}));
    (S.settings.pendingChanges||[]).filter(p=>p.status==='Pending').forEach(p=>t.push({k:'set', txt:'موافقة على تعديل إعدادات', link:'#/admin/settings'}));
    S.modules.filter(m=>m.status==='Pending Approval').forEach(m=>t.push({k:'mod', txt:'اعتماد نظام مستورد: '+m.nameAr, link:'#/admin/modules'})); }
  return t;
}

function toggleNotifs(e){
  e.stopPropagation(); const ex=$('#notifDrop'); if(ex){ ex.remove(); return; }
  const list = S.notifications.filter(n=>n.to===S.me).slice(0,25);
  const d = document.createElement('div'); d.className='dropdown'; d.id='notifDrop';
  d.innerHTML = `<div class="it" style="display:flex;align-items:center"><b style="flex:1">الإشعارات</b><a id="markAll" class="small">تعليم الكل كمقروء</a></div>` + (list.length? list.map(n=>`<div class="it ${n.read?'':'unread'}" data-n="${n.id}" style="cursor:pointer">${esc(n.t)}<small>${fmtTime(n.at)}</small></div>`).join('') : '<div class="empty">مفيش إشعارات</div>');
  document.body.appendChild(d);
  d.querySelectorAll('[data-n]').forEach(el=>el.onclick=()=>{ const n=S.notifications.find(x=>x.id===el.dataset.n); n.read=true; save(); d.remove(); if(n.link) go(n.link); else render(); });
  const ma = $('#markAll'); if(ma) ma.onclick=()=>{ list.forEach(n=>n.read=true); save(); d.remove(); render(); };
  setTimeout(()=>document.addEventListener('click', function h(ev){ if(!d.contains(ev.target)){ d.remove(); document.removeEventListener('click', h); } }), 0);
}

function openSwitcher(){
  const body = `<div class="alert i">ده Demo: تبديل المستخدم بيوريك كل دور شايف إيه ويقدر يعمل إيه. في المنتج الفعلي، كل موظف بيدخل بحسابه وكلمة السر بتاعته.</div>
  <div class="persona">${S.users.filter(u=>u.active).map(u=>`<button data-u="${u.id}" class="${u.id===S.me?'sel':''}"><div class="avatar">${esc(initials(u.name))}</div><div><b>${esc(u.name)}</b><span class="r">${esc(userRoleLabel(u))}</span></div></button>`).join('')}</div>`;
  const m = modal('تبديل المستخدم', body, [{t:'إلغاء'}]);
  m.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{ switchUser(b.dataset.u); closeModal(); });
}
function switchUser(uid, silent){
  S.me = uid; audit('LOGIN','—','','',uid); const u=U(uid); u.lastLogin=new Date().toISOString(); save();
  if(!silent) toast('دخلت باسم '+u.name+' ('+userRoleLabel(u)+')','ok');
  go(u.global==='exec' ? '#/exec' : '#/home'); render();
}

route('/tasks', ()=>{
  const u=me(); const t=tasksFor(u.id);
  const myAs = S.assessments.filter(a=>cycleOpen(a.cycle) && CT(a.control).raci.R===u.id);
  const done = myAs.filter(a=>['Submitted','Under Review','Approved'].includes(a.status)).length;
  const groups = {assess:'تقييمات مطلوبة منك', review:'مراجعات', approve:'اعتمادات', action:'إجراءات تصحيحية', verify:'تحقق من الإغلاق', ext:'طلبات تمديد', acc:'Risk Acceptance', finding:'Findings محتاجة رد', role:'تغيير صلاحيات', set:'تعديل إعدادات', mod:'Modules'};
  let html = '';
  if(myAs.length){ const cy = S.cycles.find(c=>c.id===myAs[0].cycle); const left = daysBetween(dISO(0), cy.due);
    html += `<div class="card"><div class="row"><div style="flex:1"><h3 style="margin:0">${esc(cy.name)}</h3><div class="small muted">عليك ${myAs.length} Controls • خلصت ${done} • الميعاد بعد ${left} يوم (${fmtDate(cy.due)})</div></div><b style="font-size:20px;color:var(--navy)">${Math.round(done/myAs.length*100)}%</b></div><div style="margin-top:8px">${pctBar(Math.round(done/myAs.length*100),'g')}</div>
    <div class="tablewrap" style="margin-top:12px"><table class="t"><tr><th>Control</th><th>الوصف</th><th>الحالة</th><th></th></tr>${myAs.map(a=>`<tr><td class="code">${a.control}</td><td>${esc(CT(a.control).title)}</td><td>${badgeStatus(a.status)}${a.status==='Returned'?` <span class="small" style="color:var(--red)">${esc(a.returnReason||'')}</span>`:''}</td><td>${['Not Started','Draft','Returned'].includes(a.status)?`<button class="sm primary" onclick="go('#/assess/${a.id}')">${a.status==='Not Started'?'ابدأ التقييم':'كمّل'}</button>`:`<button class="sm" onclick="go('#/assess/${a.id}')">عرض</button>`}</td></tr>`).join('')}</table></div></div>`; }
  const other = t.filter(x=>x.k!=='assess');
  const by = {}; other.forEach(x=>{ (by[x.k]=by[x.k]||[]).push(x); });
  Object.entries(by).forEach(([k,list])=>{ html += `<div class="card"><h3>${groups[k]} (${list.length})</h3>${list.map(x=>`<div class="task ${x.warn?'warn':''}" style="margin-bottom:6px" onclick="go('${x.link}')">${esc(x.txt)} ${x.x?`<span class="small muted">— ${esc(x.x.text)}</span>`:''}</div>`).join('')}</div>`; });
  if(!html) html = '<div class="card empty">مفيش مهام مطلوبة منك دلوقتي 👌</div>';
  shell('مهامي', `<div class="pagehead"><div class="t"><h1>مهامي</h1><div class="sub">كل اللي مطلوب منك، متجمع من الـ RACI ودورة التقييم والإجراءات.</div></div></div>${html}`);
});

const SYS_TABS = [['dash','Dashboard'],['assets','Assets'],['controls','Controls'],['cycles','Assessments'],['remed','Remediation'],['risks','Risks'],['raci','RACI'],['findings','Findings']];
function sysShell(mod, tab, content){
  const m = M(mod);
  shell(`<a href="#/home">الرئيسية</a> / ${esc(m.nameAr)}`, `
    <div class="pagehead"><div class="t"><h1>${m.icon} ${esc(m.nameAr)} <span class="small muted">${esc(m.name)}</span></h1><div class="sub">${esc(m.desc)} • System Owner: ${esc(uname(m.owner))} • Criticality: ${critBadge(m.crit)} • تصنيف البيانات: ${esc(m.cls)}</div></div></div>
    <div class="tabs" id="sysTabs">${SYS_TABS.map(([k,t])=>`<a href="#/sys/${mod}/${k}" class="${k===tab?'active':''}" data-tab="${k}">${t}</a>`).join('')}</div>
    ${content}`);
}
function guardMod(mod){ if(!M(mod) || !can('viewModule',{mod})){ shell('غير مسموح', `<div class="alert e">مش مسموحلك تشوف النظام ده بالدور الحالي. الصلاحية بتتحدد لكل نظام لوحده.</div>`); return false; } return true; }
const DOMAIN = {'PR.AA':'Access','PR.DS':'Data','PR.PS':'Platform','PR.IR':'Infrastructure','DE.CM':'Monitoring','ID.AM':'Assets','GV.OC':'Governance','GV.SC':'Supply Chain'};

route('/sys/:mod/:tab', (mod, tab)=>{
  if(!guardMod(mod)) return;
  ({dash:sysDash, assets:sysAssets, controls:sysControls, cycles:sysCycles, remed:sysRemed, risks:sysRisks, raci:sysRaci, findings:sysFindings}[tab]||sysDash)(mod);
});

/* ---------- Screen 16: System Dashboard ---------- */
function sysDash(mod){
  const mm = modMetrics(mod); const acts=S.actions.filter(x=>x.mod===mod);
  const open = acts.filter(x=>['Open','In Progress','Pending Verification'].includes(x.status)).length;
  const over = acts.filter(x=>overdueDays(x)>0).length;
  const fnd = S.findings.filter(f=>f.mod===mod && f.status!=='Closed').length;
  const doms = {}; controlsOf(mod).forEach(c=>{ const e=effective(c.id); if(e.mat==null) return; const d=DOMAIN[c.map.nist]||c.map.nist; (doms[d]=doms[d]||{c:[],t:[]}); doms[d].c.push(e.mat); doms[d].t.push(c.target); });
  const axes = Object.keys(doms); const avg=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10;
  const radar = axes.length>=3 ? radarSVG(axes, axes.map(a=>avg(doms[a].c)), axes.map(a=>avg(doms[a].t)), 300) : `<div class="empty">محتاج 3 مجموعات Controls على الأقل علشان الـ Radar</div>`;
  const risks = S.risks.filter(r=>r.mod===mod);
  sysShell(mod,'dash',`
    <div class="grid4" style="grid-template-columns:repeat(5,1fr)" id="kpiRow">
      <div class="kpi click" onclick="go('#/sys/${mod}/controls')"><div class="v" style="color:${colorVar(statusColor(mm.comp))}">${mm.comp}%</div><div class="l">Compliance</div></div>
      <div class="kpi click" onclick="go('#/sys/${mod}/controls')"><div class="v">${mm.mat} <span class="small muted">/ ${mm.tgt}</span></div><div class="l">Avg Maturity (Current / Target)</div></div>
      <div class="kpi click" onclick="go('#/sys/${mod}/remed')"><div class="v">${open}</div><div class="l">Open Actions</div></div>
      <div class="kpi click" onclick="go('#/sys/${mod}/remed')"><div class="v" style="color:${over?'var(--red)':'inherit'}">${over}</div><div class="l">Overdue Actions</div></div>
      <div class="kpi click" onclick="go('#/sys/${mod}/findings')"><div class="v">${fnd}</div><div class="l">Open Findings</div></div>
    </div>
    <div class="grid2" style="margin-top:16px">
      <div class="card"><h3>الـ Maturity الحالية قصاد المستهدفة</h3>${radar}<div class="legend"><span><i style="background:#1d5fbf"></i>Current</span><span><i style="background:#17b6c9"></i>Target</span></div></div>
      <div class="card"><h3>Top 5 Gaps <span class="small muted">مرتبة حسب الـ Priority Score</span></h3>
        <table class="t"><tr><th>Control</th><th>Current/Target</th><th>Gap</th><th>Priority</th></tr>${mm.gaps.slice(0,5).map(g=>`<tr class="click" onclick="showControl('${g.c.id}')"><td><span class="code">${g.c.id}</span><div class="small">${esc(g.c.title)}</div></td><td><span class="ltr">${g.cur} / ${g.c.target}</span></td><td>${g.gap}</td><td><b>${g.pr}</b></td></tr>`).join('')||'<tr><td colspan="4" class="empty">مفيش Gaps 🎉</td></tr>'}</table>
        <div class="small muted" style="margin-top:8px">Priority = Gap × Weight × Criticality</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Trend الـ Compliance (آخر الدورات)</h3>${lineSVG(trendOf(mod))}</div>
      <div class="card"><h3>Risk Heat Map <span class="small muted">(Residual)</span></h3><div class="row" style="align-items:flex-start">${heatTable(risks,'res','')}<div class="small muted" style="max-width:220px">${risks.length} Risks مسجلة. اضغط على تاب Risks للتفاصيل.</div></div></div>
    </div>`);
}

  const canM = can('manageAssets',{mod});
  const tname = id=>(m.assetTypes.find(t=>t.id===id)||{name:id}).name;
  sysShell(mod,'assets',`
    <div class="card"><div class="row">
      <div style="width:180px"><label>Asset Type</label><select id="fType"><option value="">الكل</option>${opts(m.assetTypes.map(t=>({v:t.id,t:t.name})), flt.type)}</select></div>
      <div style="width:160px"><label>Criticality</label><select id="fCrit"><option value="">الكل</option>${opts([{v:'3',t:'High'},{v:'2',t:'Medium'},{v:'1',t:'Low'}], flt.crit)}</select></div>

      <button ${canM?'':'disabled'} id="btnImport">⬆ Import from Excel</button>
      <button id="btnExportA">⬇ Export</button>

    <div class="card tight"><div class="tablewrap"><table class="t"><tr><th>Asset ID</th><th>Name</th><th>Type</th><th>Owner</th><th>Criticality</th><th>Location</th><th>Last Assessed</th></tr>
      ${list.map(a=>`<tr class="click" data-a="${a.id}"><td class="code">${a.id}</td><td>${esc(a.name)}</td><td>${esc(tname(a.type))}</td><td>${esc(uname(a.owner))}</td><td>${critBadge(a.crit)}</td><td>${esc(a.loc)}</td><td>${lastAssessed(a)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">مفيش أصول</td></tr>'}</table></div></div>`);
  $('#fType').onchange=$('#fCrit').onchange=()=>sysAssets(mod,{type:$('#fType').value, crit:$('#fCrit').value});

}
function lastAssessed(a){ const ds = S.assessments.filter(x=>x.mod===a.mod && x.status==='Approved' && CT(x.control).applies.includes(a.type)).map(x=>x.approvedAt).filter(Boolean).sort(); return ds.length? fmtDate(ds[ds.length-1]) : '—'; }
function showAsset(id){
  const a=S.assets.find(x=>x.id===id); const m=M(a.mod); const t=m.assetTypes.find(x=>x.id===a.type)||{name:a.type,fields:[]};
  const cs = S.controls.filter(c=>c.mod===a.mod && c.applies.includes(a.type));
  const rs = S.risks.filter(r=>r.mod===a.mod && r.controls.some(cid=>cs.find(c=>c.id===cid)));
  modal(`${a.id} – ${esc(a.name)}`, `<div class="kv"><div>Type</div><div>${esc(t.name)}</div><div>Owner</div><div>${esc(uname(a.owner))}</div><div>Criticality</div><div>${critBadge(a.crit)}</div><div>Location</div><div>${esc(a.loc)}</div>${Object.entries(a.f||{}).map(([k,v])=>`<div>${esc(k)}</div><div>${esc(v)}</div>`).join('')}</div>
    <h3 style="margin-top:16px">الـ Controls اللي بتنطبق عليه (${cs.length})</h3><table class="t"><tr><th>Control</th><th>Maturity</th><th>الحالة</th></tr>${cs.map(c=>{const e=effective(c.id); return `<tr><td><span class="code">${c.id}</span> ${esc(c.title)}</td><td><span class="ltr">${e.mat==null?'—':e.mat} / ${c.target}</span></td><td>${e.impl?badgeStatus(e.impl):'—'}</td></tr>`;}).join('')}</table>
    <h3 style="margin-top:16px">الـ Risks المرتبطة (${rs.length})</h3>${rs.map(r=>`<div class="small">• ${esc(r.title)} <span class="b ${riskLevel(riskResidual(r).score).c}">${riskResidual(r).score}</span></div>`).join('')||'<div class="small muted">—</div>'}`, null, true);
}
function assetForm(mod){
  if(!can('manageAssets',{mod})) return denied();

/* ---------- Screen 5b: RACI per system (Controls × People) ---------- */
function raciIssues(mod){
  const iss=[]; const cs=controlsOf(mod); const load={};
  cs.forEach(c=>{ if(!c.raci.A) iss.push({k:'e',t:c.id+': ملهوش A'}); if(!c.raci.R) iss.push({k:'e',t:c.id+': ملهوش R'});
    if(c.raci.R && c.raci.R===c.raci.A) iss.push({k:'w',t:c.id+': نفس الشخص R وA. ده مسموح، بس التقييم هيروح للـ CISO على طول من غير مراجعة الـ Owner.'});
    if((!c.raci.C||!c.raci.C.length)) iss.push({k:'w',t:c.id+' ملهوش C. مسموح، بس اتأكد إن مفيش حد لازم يتسأل.'});
    [c.raci.R,c.raci.A].forEach(u=>{ if(u && U(u) && U(u).global==='auditor') iss.push({k:'e',t:c.id+': Auditor independence violation'}); });
    if(c.raci.R) load[c.raci.R]=(load[c.raci.R]||0)+1; });
  return {iss, load};
}
function sysRaci(mod){
  const cs=controlsOf(mod); const ed=can('editRaci',{mod}); const {iss,load}=raciIssues(mod);
  const pool = S.users.filter(u=>u.active && u.global!=='exec');

    <div>
      <div class="card"><h3>تفاصيل الـ Control</h3><div class="kv"><div>Test Method</div><div>${esc(c.test)}</div><div>Required Evidence</div><div>${esc(c.evid)}</div><div>Frequency</div><div>${esc(c.freq)}</div><div>Target Maturity</div><div><b>${c.target}</b></div><div>الدورة اللي فاتت</div><div>${prev==null?'—':'Maturity '+prev}</div><div>Frameworks</div><div>${mapStr(c.map)}</div></div></div>

    </div>

      <h3>التقييم</h3>
      <div class="grid2"><div class="field"><label>Status</label><select id="fImpl" ${dis}>${opts(['','Implemented','Partial','Not Implemented','Not Applicable'].map(v=>({v,t:v||'— اختار —'})), a.na?'Not Applicable':a.impl)}</select></div>
      <div class="field"><label>Current Maturity</label><select id="fMat" ${dis}>${opts([{v:'',t:'— اختار —'},0,1,2,3,4,5], a.mat==null?'':a.mat)}</select></div></div>

      <div class="alert i" id="calcBox"></div><div id="valBox"></div>
      ${editable?`<div class="row"><button class="primary" id="btnSubmit">Submit for Review</button><button id="btnDraft">Save Draft</button><div class="spacer"></div>${next?`<button id="btnNext">Next Control ←</button>`:''}</div>`:''}

      if(owner===a.assessor){ a.status='Under Review'; a.forwardedAt=dISO(0); a.hist.push({t:'Submit — مرحلة مراجعة الـ Owner اتشالت لأن الـ Owner هو نفسه المقيّم', by:S.me, at:new Date().toISOString()}); audit('REVIEW_SKIPPED',a.id,'','Owner = Assessor'); notify(S.users.filter(u=>u.global==='ciso').map(u=>u.id),'تقييم '+c.id+' مستني اعتمادك','#/approve'); }
      else { a.status='Submitted'; a.hist.push({t:'Submit for Review', by:S.me, at:new Date().toISOString()}); notify(owner, uname(S.me)+' بعت تقييم '+c.id+' للمراجعة','#/review'); }
      audit('SUBMIT_ASSESSMENT',a.id,'Draft',a.status); save(); toast('اتبعت للمراجعة، والتقييم اتقفل عندك','ok');
      if(next) go('#/assess/'+next.id); else go('#/tasks'); };

function reviewView(a){

   ${(a.comments||[]).map(x=>`<div class="small" style="margin-top:8px">💬 ${esc(uname(x.by))}: ${esc(x.t)}</div>`).join('')}`;
}
function returnForm(){ return `<div class="field"><label>سبب الإرجاع *</label><select id="rvR">${opts(RETURN_REASONS)}</select></div><div class="field"><label>التعليق *</label><textarea id="rvC" placeholder="اكتب للمقيّم المطلوب بالظبط"></textarea></div>`; }
function doReturn(a, bg){ const cm=$('#rvC',bg).value.trim(); if(!cm){ toast('لازم تكتب تعليق للمقيّم','err'); return false; }
  const old=a.status; a.status='Returned'; a.returnReason=$('#rvR',bg).value; a.returns=(a.returns||0)+1; (a.returnReasons=a.returnReasons||[]).push(a.returnReason); a.returnComment=cm; a.hist.push({t:'Returned: '+a.returnReason+' — '+cm, by:S.me, at:new Date().toISOString()});
  notify(a.assessor,'تقييم '+a.control+' رجعلك: '+a.returnReason,'#/assess/'+a.id); audit('RETURN_ASSESSMENT',a.id,old,'Returned: '+a.returnReason); save(); toast('رجع للمقيّم','ok'); render(); }
function reviewModal(aid, as){
  const a=S.assessments.find(x=>x.id===aid); const c=CT(a.control);
  if(as==='owner'){

function approveA(a, override){
  const c=CT(a.control);
  if(override){ a.hist.push({t:'Override Maturity: '+a.mat+' ← '+override.v+' — '+override.r, by:S.me, at:new Date().toISOString()}); audit('OVERRIDE_MATURITY',a.id,a.mat,override.v+' ('+override.r+')'); notify(a.assessor,'الـ CISO غيّر Maturity '+a.control+' من '+a.mat+' لـ '+override.v,'#/assess/'+a.id); a.mat=override.v; a.overridden=true; }
  a.status='Approved'; a.approvedBy=S.me; a.approvedAt=dISO(0); a.hist.push({t:'اتعتمد نهائيًا', by:S.me, at:new Date().toISOString()});
  audit('APPROVE_ASSESSMENT',a.id,'Under Review','Approved');
  const gap = a.na?0:Math.max(0,c.target-a.mat);
  if(gap>0 && !S.actions.find(x=>x.control===c.id && !['Closed'].includes(x.status))){
    const x={id:'ACT-'+String(S.seq.act++).padStart(3,'0'), mod:a.mod, control:c.id, text:a.proposed||('رفع مستوى '+c.id+' من '+a.mat+' لـ '+c.target), owner:c.raci.R, acc:c.raci.A, due:dISO(60), status:'Open', created:dISO(0), tl:[{at:dISO(0),by:S.me,t:'اتعمل أوتوماتيك من اعتماد التقييم (Gap = '+gap+')'}], ext:[], evidence:[], pr:priority(c,gap)};
    S.actions.push(x); notify(x.owner,'إجراء تصحيحي جديد '+x.id+' عليك','#/sys/'+x.mod+'/remed'); audit('CREATE_ACTION',x.id,'',x.text);
  }
  notify(a.assessor,'تقييم '+a.control+' اتعتمد','#/assess/'+a.id);
}

let riskMode='inh', riskCell=null;
function sysRisks(mod){
  const all=S.risks.filter(r=>r.mod===mod); const list=riskCell? all.filter(r=>{ const v=riskMode==='res'?riskResidual(r):{L:r.L,I:r.I}; return v.L+'-'+v.I===riskCell; }) : all;
  const canReq=can('requestAcceptance',{mod}); const canEd = me().global==='ciso' || roleIn(me(),mod)==='owner';
  sysShell(mod,'risks',`<div class="split" style="grid-template-columns:1fr 1.6fr">
    <div class="card"><div class="row"><h3 style="margin:0;flex:1">Heat Map 5×5</h3><div class="row" style="gap:4px"><button class="sm ${riskMode==='inh'?'primary':''}" data-m="inh">Inherent</button><button class="sm ${riskMode==='res'?'primary':''}" data-m="res">Residual</button></div></div>
      <div style="margin-top:12px" id="heatBox">${heatTable(all,riskMode,'riskCellClick')}</div>${riskCell?`<div class="small" style="margin-top:8px">فلتر: الخانة ${riskCell} <a onclick="riskCell=null;sysRisks('${mod}')">إلغاء الفلتر</a></div>`:'<div class="small muted" style="margin-top:8px">اضغط على أي خانة علشان تشوف الـ Risks اللي فيها.</div>'}
      <div class="alert i small" style="margin-top:12px">Inherent = Likelihood × Impact. والـ Residual بيتحسب بمعادلة تدريبية معلنة: Likelihood × (1 − متوسط Maturity الـ Controls ÷ 5 × 0.6)، وده تقدير مش تنبؤ حقيقي.</div></div>
    <div class="card tight"><div class="tablewrap"><table class="t"><tr><th>Risk</th><th>L</th><th>I</th><th>Inherent</th><th>Residual</th><th>Risk Owner</th><th>Treatment</th><th>Controls</th><th></th></tr>
    ${list.map(r=>{ const res=riskResidual(r), lv=riskLevel(res.score), il=riskLevel(r.L*r.I); const ra=S.acceptances.find(x=>x.risk===r.id && x.status!=='Rejected'); return `<tr><td><span class="code small">${r.id}</span><div>${esc(r.title)}</div></td><td>${canEd?`<select class="rL" data-r="${r.id}" style="width:52px">${opts([1,2,3,4,5],r.L)}</select>`:r.L}</td><td>${canEd?`<select class="rI" data-r="${r.id}" style="width:52px">${opts([1,2,3,4,5],r.I)}</select>`:r.I}</td><td><span class="b ${il.c}">${r.L*r.I}</span></td><td><span class="b ${lv.c}">${res.score} ${lv.t}</span></td><td class="small">${esc(uname(r.owner))}</td><td>${r.treat==='Accept'?'<span class="b y">Accept</span>':`<span class="small">${r.treat}</span>`}${ra&&ra.status!=='Approved'?'<div class="small muted">طلب قبول '+badgeStatus(ra.status)+'</div>':''}</td><td class="small">${r.controls.map(c=>`<a class="code" onclick="showControl('${c}')">${c}</a>`).join(' ')}</td><td>${canReq && r.treat!=='Accept' && !ra?`<button class="sm" data-ra="${r.id}">Risk Acceptance</button>`:''}</td></tr>`; }).join('')}</table></div></div></div>`);
  $$('[data-m]').forEach(b=>b.onclick=()=>{ riskMode=b.dataset.m; riskCell=null; sysRisks(mod); });
  $$('.rL,.rI').forEach(s=>s.onchange=()=>{ const r=S.risks.find(x=>x.id===s.dataset.r); const k=s.classList.contains('rL')?'L':'I'; audit('EDIT_RISK',r.id+' '+k,r[k],s.value); r[k]=+s.value; save(); sysRisks(mod); });
  $$('[data-ra]').forEach(b=>b.onclick=()=>acceptForm(b.dataset.ra));
}

function acceptForm(rid){

function selectedRisks(){ return (RISK_LIBRARY[W.type]||[]).filter(r=>W.risks[r.k]).concat(W.custom.map((c,i)=>({k:'c'+i,t:c,ar:c}))); }

function buildSuggestions(){

function moduleDef(){ return {format:'SCH-Module', v:1, name:W.name, nameEn:W.nameEn, desc:W.desc, icon:W.icon, type:W.type, crit:W.crit, cls:W.cls, assetTypes:W.assetTypes, risks:selectedRisks(), controls:W.controls.filter(c=>c.on)}; }
function installModule(def, owner, assessor, status){
  const id='m'+Date.now().toString(36);
  const ats=def.assetTypes.map((t,i)=>({id:'t'+i, name:t.name, fields:t.fields.map(f=>f.n)}));
  const m={id, name:def.nameEn||def.name, nameAr:def.name, icon:def.icon||'🗂️', type:def.type, owner, crit:def.crit||2, cls:def.cls||'Internal', desc:def.desc||'', status:status||'Active', version:'1.0', assetTypes:ats};
  S.modules.push(m);
  const cisoId=(S.users.find(u=>u.global==='ciso')||{}).id;
  def.controls.forEach(c=>{ S.controls.push({id:c.id, mod:id, title:c.title, type:c.type, w:c.w, applies:(c.applies||[]).map(n=>(ats.find(t=>t.name===n)||{}).id).filter(Boolean), test:c.test, evid:c.evid||'حسب الإجراء', freq:c.freq, target:c.target, map:c.map||{iso:'—',nist:'—',cis:'—'}, raci:{R:assessor, A:owner, C:['u1'], I:[cisoId]}, version:1, history:[]}); });
  def.risks.forEach((r,i)=>{ S.risks.push({id:'R-'+id+'-'+(i+1), mod:id, title:r.ar||r.t, L:3, I:3, owner, treat:'Mitigate', controls:def.controls.filter(c=>c.risk===r.k).map(c=>c.id)}); });
  const ou=U(owner); ou.mods=Object.assign({},ou.mods,{[id]:'owner'}); const au=U(assessor); if(au && assessor!==owner) au.mods=Object.assign({},au.mods,{[id]:'assessor'});
  return m;
}
function publishWizard(){
  const def=moduleDef(); if(def.controls.some(c=>S.controls.find(x=>x.id===c.id))){ const pre=wzPrefix()+Date.now().toString(36).slice(-2).toUpperCase(); def.controls.forEach((c,i)=>c.id=pre+'-'+String(i+1).padStart(2,'0')); }
  const m=installModule(def, W.owner, W.assessor);

}

function orgMetrics(){
  const ms=S.modules.filter(m=>m.status==='Active'); const per=ms.map(m=>({m, mm:modMetrics(m.id)})).filter(x=>x.mm.applicable);
  const tot=per.reduce((a,x)=>a+x.mm.applicable,0);
  const comp= tot? Math.round(per.reduce((a,x)=>a+x.mm.comp*x.mm.applicable,0)/tot) : 0;
  const mat= tot? Math.round(per.reduce((a,x)=>a+x.mm.mat*x.mm.applicable,0)/tot*10)/10 : 0;
  return {per, comp, mat};
}
function prevOrgComp(){ const ms=S.modules.filter(m=>m.status==='Active'); let n=0,s=0; ms.forEach(m=>{ const cs=S.cycles.filter(c=>c.mod===m.id && c.summary); const p=cs[cs.length-1]; if(p){ s+=p.summary.comp; n++; } }); return n?Math.round(s/n):null; }

  if(id==='status'){ const rows=[]; mods.forEach(m=>controlsOf(m).forEach(c=>{ const e=effective(c.id); rows.push([c.id,c.title,c.map.iso,c.map.nist,c.map.cis,e.na?'Not Applicable':'Applicable',e.impl||'—',e.mat==null?'—':e.mat,c.target]); })); return {head:['Control','الوصف','ISO 27001','NIST CSF','CIS','Applicability','Status','Maturity','Target'], rows}; }
  if(id==='raci'){ const rows=[]; mods.forEach(m=>controlsOf(m).forEach(c=>rows.push([M(m).nameAr,c.id,uname(c.raci.R),uname(c.raci.A),(c.raci.C||[]).map(uname).join('، '),(c.raci.I||[]).map(uname).join('، ')]))); return {head:['النظام','Control','R','A','C','I'], rows}; }
  if(id==='find'){ const rows=S.findings.filter(f=>mods.includes(f.mod)).map(f=>[f.id,M(f.mod).nameAr,f.title,f.sev,f.status,f.response||'—']); return {head:['ID','النظام','Finding','Severity','Status','Management Response'], rows}; }
  if(id==='kpi'){ const rows=[]; teamOf(S.me).forEach(x=>userKpis(x.id).forEach(({g,list})=>list.forEach(r=>rows.push([x.name,g.t,r.kp.t,kpiFmt(r.kp,r.v,r.sign),(r.kp.dir==='up'?'≥ ':'≤ ')+kpiFmt(r.kp,kpiTarget(r.kp.k)),{g:'محقق',y:'قريب',r:'محتاج متابعة',n:'—'}[kpiStatus(r.kp,r.v)],r.n])))); return {head:['الموظف','الدور','المؤشر','القيمة','Target','الحالة','عدد الحالات'], rows}; }
  if(id==='trail'){ return {head:['#','Timestamp','User','Action','Object','Old','New','IP','Hash'], rows:S.audit.slice().reverse().map(e=>[e.seq,e.at,uname(e.user),e.action,e.obj,e.old,e.nw,e.ip,e.hash])}; }
  return {head:[],rows:[]};
}

function deactivate(uid){
  const t=U(uid); if(uid===S.me) return denied();
  const ctl=S.controls.filter(c=>c.raci.R===uid||c.raci.A===uid); const acts=S.actions.filter(x=>x.owner===uid && ['Open','In Progress'].includes(x.status));
  const doIt=(to)=>{ ctl.forEach(c=>{ if(c.raci.R===uid) c.raci.R=to; if(c.raci.A===uid) c.raci.A=to; }); acts.forEach(x=>x.owner=to); S.assessments.filter(a=>a.assessor===uid&&cycleOpen(a.cycle)).forEach(a=>a.assessor=to); S.modules.forEach(m=>{ if(m.owner===uid) m.owner=to; });
    if(to){ const tu=U(to); Object.entries(t.mods||{}).forEach(([m,r])=>{ if(!tu.mods[m] || r==='owner') tu.mods[m]=r; }); }
    t.active=false; audit('DEACTIVATE_USER',t.username,'',to?'reassigned to '+U(to).username:''); save(); toast('اتوقف الحساب','ok'); render(); };
  if(!ctl.length && !acts.length) return modal('Deactivate '+esc(t.name), 'الحساب هيتوقف ومش هيتمسح.', [{t:'Deactivate', cls:'danger', fn:()=>doIt(null)},{t:'إلغاء'}]);
  modal('Deactivate '+esc(t.name), `<div class="alert w">الموظف ده عليه مهام مفتوحة: ${ctl.length} Controls في الـ RACI و${acts.length} إجراءات تصحيحية. لازم تتحول لحد تاني الأول.</div><div class="field"><label>تحويل المهام لـ *</label><select id="dvTo">${userOpts('', x=>x.id!==uid && !x.global)}</select></div>`,
   [{t:'تحويل وDeactivate', cls:'danger', fn:(bg)=>doIt($('#dvTo',bg).value)},{t:'إلغاء'}]);
}

/* ===== Employee KPIs: computed from recorded work, never from maturity scores ===== */
function dd(a,b){ return Math.max(0, Math.round((Date.parse(b)-Date.parse(a))/DAY)); }
function avg(xs){ return xs.length? Math.round(xs.reduce((a,b)=>a+b,0)/xs.length*10)/10 : null; }
function pct(a,b){ return b? Math.round(a/b*100) : null; }
const KPI_GROUPS = [
  {k:'assessor', t:'المقيّم (Assessor)', applies:uid=>S.assessments.some(a=>a.assessor===uid) },
  {k:'action', t:'منفّذ الإجراءات (Action Owner)', applies:uid=>S.actions.some(x=>x.owner===uid) },
  {k:'owner', t:'System Owner', applies:uid=>Object.values((U(uid)||{}).mods||{}).includes('owner') },
  {k:'ciso', t:'CISO', applies:uid=>(U(uid)||{}).global==='ciso' },
  {k:'auditor', t:'Internal Auditor', applies:uid=>(U(uid)||{}).global==='auditor' }
];
function ownedMods(uid){ return Object.entries((U(uid)||{}).mods||{}).filter(([m,r])=>r==='owner' && M(m)).map(([m])=>m); }
const KPIS = [
  {k:'onTime', g:'assessor', t:'Assessment On-time Rate', unit:'%', dir:'up', f:'التقييمات اللي اتبعتت قبل الميعاد ÷ التقييمات المطلوبة اللي ميعادها جه',
   calc(uid){ const mine=S.assessments.filter(a=>a.assessor===uid); const due=mine.filter(a=>{ const c=S.cycles.find(x=>x.id===a.cycle); return a.submittedAt || (c && c.due<dISO(0)); });
     const ok=due.filter(a=>{ const c=S.cycles.find(x=>x.id===a.cycle); return a.submittedAt && a.submittedAt<=c.due; }).length; return {v:pct(ok,due.length), n:due.length}; }},
  {k:'ftAccept', g:'assessor', t:'First-time Acceptance', unit:'%', dir:'up', f:'التقييمات اللي اتقبلت من غير ما ترجع ÷ اللي اتبعتت',
   calc(uid){ const s=S.assessments.filter(a=>a.assessor===uid && a.submittedAt); return {v:pct(s.filter(a=>!a.returns).length, s.length), n:s.length}; }},
  {k:'evQuality', g:'assessor', t:'Evidence Quality', unit:'%', dir:'up', f:'1 − (الإرجاعات بسبب Insufficient Evidence ÷ التقييمات اللي اتبعتت)',
   calc(uid){ const s=S.assessments.filter(a=>a.assessor===uid && a.submittedAt); const bad=s.filter(a=>(a.returnReasons||[]).includes('Insufficient Evidence')).length; return {v:s.length?100-pct(bad,s.length):null, n:s.length}; }},
  {k:'auditAcc', g:'assessor', t:'Audit Accuracy', unit:'%', dir:'up', f:'التقييمات المعتمدة (Maturity ≥ 3) اللي المراجعة مالقتش فيها "Approved maturity not supported"',
   calc(uid){ const s=S.assessments.filter(a=>a.assessor===uid && a.status==='Approved' && a.mat>=3); const bad=s.filter(a=>S.findings.some(f=>f.control===a.control && f.note)).length; return {v:s.length?100-pct(bad,s.length):null, n:s.length}; }},
  {k:'remOnTime', g:'action', t:'Remediation On-time', unit:'%', dir:'up', f:'الإجراءات اللي خلصت قبل ميعادها ÷ الإجراءات اللي ميعادها جه',
   calc(uid){ const xs=S.actions.filter(x=>x.owner===uid); const rel=xs.filter(x=>x.doneAt || x.due<dISO(0)); const ok=rel.filter(x=>x.doneAt && x.doneAt<=x.due).length; return {v:pct(ok,rel.length), n:rel.length}; }},
  {k:'overdueDays', g:'action', t:'Avg Overdue Days', unit:'يوم', dir:'down', f:'متوسط أيام التأخير للإجراءات المفتوحة المتأخرة',
   calc(uid){ const od=S.actions.filter(x=>x.owner===uid).map(overdueDays).filter(d=>d>0); const open=S.actions.filter(x=>x.owner===uid && ['Open','In Progress'].includes(x.status)).length; return {v:od.length?avg(od):0, n:open}; }},
  {k:'ftVerify', g:'action', t:'First-time Verification', unit:'%', dir:'up', f:'الإجراءات اللي المراجع قفلها من غير ما يرفضها ÷ الإجراءات المقفولة',
   calc(uid){ const c=S.actions.filter(x=>x.owner===uid && x.status==='Closed'); return {v:pct(c.filter(x=>!x.rejections).length, c.length), n:c.length}; }},
  {k:'reviewTurn', g:'owner', t:'Review Turnaround', unit:'يوم', dir:'down', f:'متوسط الأيام من الـ Submit لحد مراجعة الـ Owner',
   calc(uid){ const ms=ownedMods(uid); const s=S.assessments.filter(a=>ms.includes(a.mod) && a.submittedAt && a.reviewedAt && a.reviewedBy===uid); return {v:avg(s.map(a=>dd(a.submittedAt,a.reviewedAt))), n:s.length}; }},
  {k:'findResp', g:'owner', t:'Finding Response Time', unit:'يوم', dir:'down', f:'متوسط الأيام لحد الرد على الـ Finding (والمفتوح بيتحسب لحد النهارده)',
   calc(uid){ const ms=ownedMods(uid); const fs=S.findings.filter(f=>ms.includes(f.mod)); return {v:avg(fs.map(f=>dd(f.at, f.respondedAt||dISO(0)))), n:fs.length}; }},
  {k:'cycleDone', g:'owner', t:'Cycle Completion', unit:'%', dir:'up', f:'دورات التقييم اللي اتقفلت في ميعادها ÷ الدورات اللي ميعادها جه',
   calc(uid){ const ms=ownedMods(uid); const cs=S.cycles.filter(c=>ms.includes(c.mod) && (c.closedAt || c.due<dISO(0)) && !c.summary); return {v:pct(cs.filter(c=>c.closedAt && c.closedAt<=c.due).length, cs.length), n:cs.length}; }},
  {k:'compTrend', g:'owner', t:'Compliance Trend', unit:'نقطة', dir:'up', f:'تغيّر الـ Compliance عن الدورة اللي فاتت (اتجاه، مش درجة). بيتحسب من تقييمات معتمدة بس',
   calc(uid){ const ms=ownedMods(uid); const ds=ms.map(m=>{ const cs=S.cycles.filter(c=>c.mod===m && c.summary); const p=cs[cs.length-1]; return p? modMetrics(m).comp - p.summary.comp : null; }).filter(x=>x!=null); return {v:ds.length?Math.round(avg(ds)):null, n:ds.length, sign:true}; }},
  {k:'approvalTurn', g:'ciso', t:'Approval Turnaround', unit:'يوم', dir:'down', f:'متوسط الأيام من وصول التقييم للـ CISO لحد الاعتماد',

  {k:'escalRate', g:'ciso', t:'Overdue Escalation Rate', unit:'%', dir:'down', f:'الإجراءات المتأخرة أكتر من 14 يوم ÷ الإجراءات المفتوحة',
   calc(uid){ const o=S.actions.filter(x=>['Open','In Progress'].includes(x.status)); return {v:pct(o.filter(x=>overdueDays(x)>14).length, o.length), n:o.length}; }},
  {k:'verifyTurn', g:'auditor', t:'Verification Turnaround', unit:'يوم', dir:'down', f:'متوسط الأيام من Mark as Done لحد التحقق (والمستني بيتحسب لحد النهارده)',
   calc(uid){ const xs=S.actions.filter(x=>x.doneAt && (x.closedBy===uid || x.status==='Pending Verification')); return {v:avg(xs.map(x=>dd(x.doneAt, x.closedAt||dISO(0)))), n:xs.length}; }},
  {k:'coverage', g:'auditor', t:'Audit Coverage', unit:'%', dir:'up', f:'الـ Controls اللي اتراجعت (Findings أو تحقق من إجراء) ÷ كل الـ Controls',
   calc(uid){ const act=S.controls.filter(c=>M(c.mod)&&M(c.mod).status==='Active'); const set=new Set(); S.findings.forEach(f=>f.control&&set.add(f.control)); S.actions.filter(x=>x.closedBy===uid).forEach(x=>set.add(x.control)); return {v:pct([...set].filter(c=>act.find(x=>x.id===c)).length, act.length), n:act.length}; }}
];
function kpiTarget(k){ return (S.settings.kpiTargets||{})[k]; }
function kpiStatus(kp, v){
  if(v==null) return 'n'; const t=kpiTarget(kp.k);
  if(kp.dir==='up'){ if(v>=t) return 'g'; return (kp.unit==='%'? v>=t-10 : v>=t-2)?'y':'r'; }
  if(v<=t) return 'g'; return (kp.unit==='%'? v<=t+10 : v<=t+2)?'y':'r';
}
function kpiFmt(kp, v, sign){ if(v==null) return '—'; return (sign&&v>0?'+':'')+v+(kp.unit==='%'?'%':' '+kp.unit); }
function kpiFmtH(kp, v, sign){ return `<span class="ltr">${esc(kpiFmt(kp,v,sign))}</span>`; }
function userKpis(uid){ return KPI_GROUPS.filter(g=>g.applies(uid)).map(g=>({g, list:KPIS.filter(k=>k.g===g.k).map(k=>Object.assign({kp:k}, k.calc(uid)))})); }
function sparkSVG(vals, cl){
  const xs=vals.filter(v=>v!=null); if(xs.length<2) return '';
  const mx=Math.max(...xs), mn=Math.min(...xs), w=90, h=28, X=i=>4+i*(w-8)/(vals.length-1), Y=v=>h-4-(mx===mn?0.5:(v-mn)/(mx-mn))*(h-8);
  const pts=vals.map((v,i)=>v==null?null:X(i)+','+Y(v)).filter(Boolean).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="direction:ltr"><polyline points="${pts}" fill="none" stroke="${colorVar(cl)}" stroke-width="2"/>${vals.map((v,i)=>v==null?'':`<circle cx="${X(i)}" cy="${Y(v)}" r="2.5" fill="${colorVar(cl)}"/>`).join('')}</svg>`;
}
function kpiCard(uid, r){
  const kp=r.kp; const cl=kpiStatus(kp, r.v); const h=((S.kpiHist||{})[uid]||{})[kp.k]||[];
  const prev=h[h.length-1]; const better = prev==null||r.v==null? null : (kp.dir==='up'? r.v-prev : prev-r.v);
  return `<div class="kpi" style="border-top:3px solid ${colorVar(cl)}" data-kpi="${kp.k}">
    <div class="row" style="align-items:flex-start"><div style="flex:1"><div class="l" style="font-weight:600;color:var(--navy)">${kp.t}</div><div class="v" style="color:${colorVar(cl)}">${kpiFmtH(kp,r.v,r.sign)}</div></div>${sparkSVG(h.concat([r.v]), cl)}</div>
    <div class="small muted">Target: <span class="ltr">${kp.dir==='up'?'≥':'≤'} ${kpiFmt(kp,kpiTarget(kp.k))}</span> ${better==null?'':`• <b style="color:${better>=0?'var(--green)':'var(--red)'}">${better>=0?'▲ أحسن':'▼ أقل'}</b> من الربع اللي فات`}</div>
    <div class="small muted">محسوب من ${r.n} حالة ${r.n<3?'<span class="b y" title="عدد الحالات قليل، والرقم ممكن يبقى مضلل">عينة صغيرة</span>':''}</div>
    <details class="small" style="margin-top:4px"><summary style="cursor:pointer;color:var(--blue)">إزاي اتحسب؟</summary>${esc(kp.f)}</details></div>`;
}
function kpiBanner(){ return S.settings.kpiOfficial? '' : `<div class="alert w">المؤشرات دي <b>استرشادية</b> ومش داخلة في تقييم الأداء الرسمي، لحد ما الـ HR والإدارة يعتمدوا الطريقة والموظفين يتبلّغوا بيها.</div>`; }

const Tour = {
  i:0, active:false,
  start(){ this.i=0; this.active=true; this.show(); },
  stop(){ this.active=false; ['tourHole','tourPop','tourMask'].forEach(id=>{ const e=document.getElementById(id); if(e) e.remove(); }); S.tourDone=true; save(); },
  show(){
    const st=TOUR_STEPS[this.i]; if(!st) return this.stop();
    if(st.pre) st.pre();
    if(S.me!==st.as){ S.me=st.as; save(); }
    if(location.hash!==st.route) location.hash=st.route; else render();
    setTimeout(()=>this.place(), 260);
  },
  place(){
    const st=TOUR_STEPS[this.i]; ['tourHole','tourPop'].forEach(id=>{ const e=document.getElementById(id); if(e) e.remove(); });
    let mask=document.getElementById('tourMask'); if(!mask){ mask=document.createElement('div'); mask.id='tourMask'; document.body.appendChild(mask); }
    const el = st.sel ? document.querySelector(st.sel) : null;
    const hole=document.createElement('div'); hole.id='tourHole'; const pop=document.createElement('div'); pop.id='tourPop';
    const u=U(st.as);
    pop.innerHTML=`<div class="as">👤 ${esc(u.name)} — ${esc(userRoleLabel(u))}</div><h4>${esc(st.t)}</h4><p>${esc(st.p)}</p><div class="row"><span class="pg">${this.i+1} / ${TOUR_STEPS.length}</span><div class="spacer"></div>${this.i>0?'<button class="sm" id="tPrev">السابق</button>':''}<button class="sm primary" id="tNext">${this.i===TOUR_STEPS.length-1?'إنهاء':'التالي'}</button><button class="sm ghost" id="tEnd">خروج</button></div>`;
    document.body.appendChild(hole); document.body.appendChild(pop);
    if(el){ el.scrollIntoView({block:'center'}); }
    setTimeout(()=>{
      if(el){ const r=el.getBoundingClientRect(); const pad=6; const h=Math.min(r.height+pad*2, window.innerHeight-40);
        Object.assign(hole.style,{left:(r.left-pad)+'px', top:Math.max(8,r.top-pad)+'px', width:(r.width+pad*2)+'px', height:h+'px'});
        const pw=pop.offsetWidth, ph=pop.offsetHeight; let top=r.bottom+14, left=r.left+r.width/2-pw/2;
        if(top+ph>window.innerHeight-10) top=Math.max(10, r.top-ph-14); if(top<10 || (r.height>window.innerHeight*0.6)) top=Math.max(10, window.innerHeight-ph-20);
        left=Math.max(10, Math.min(window.innerWidth-pw-10, left)); Object.assign(pop.style,{top:top+'px', left:left+'px'});
      } else { Object.assign(hole.style,{left:'50%',top:'50%',width:'0px',height:'0px'}); Object.assign(pop.style,{top:'35%', left:`calc(50% - ${pop.offsetWidth/2}px)`}); }
    }, 60);
    document.getElementById('tNext').onclick=()=>{ this.i++; if(this.i>=TOUR_STEPS.length) return this.stop(); this.show(); };
    const pv=document.getElementById('tPrev'); if(pv) pv.onclick=()=>{ this.i--; this.show(); };
    document.getElementById('tEnd').onclick=()=>this.stop();
  }
};
window.addEventListener('resize', ()=>{ if(Tour.active) Tour.place(); });
